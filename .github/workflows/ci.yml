name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Unit tests
        run: go test -race ./internal/...

      - name: Phase 1 integration tests
        run: go test ./tests/ -run Phase1 -v -timeout 60s

      - name: Log package tests (MemLog + FileLog, race detector)
        run: go test -race ./internal/log/... -v -timeout 60s

      - name: Phase 2 integration tests
        run: go test ./tests/ -run Phase2 -v -timeout 60s

      - name: Phase 3 integration tests
        run: go test ./tests/ -run Phase3 -v -timeout 120s
