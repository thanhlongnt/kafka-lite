apiVersion: v1
kind: Service
metadata:
  name: coordinator
spec:
  clusterIP: None  # headless — gives each pod a stable DNS entry
  selector:
    app: coordinator
  ports:
    - name: grpc
      port: 9093
    - name: raft
      port: 7000
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: coordinator
spec:
  serviceName: coordinator
  replicas: 5
  selector:
    matchLabels:
      app: coordinator
  template:
    metadata:
      labels:
        app: coordinator
    spec:
      containers:
        - name: coordinator
          image: kafka-lite:latest
          imagePullPolicy: Never  # use image built into Minikube daemon
          command: ["/bin/sh", "/scripts/start-coordinator.sh"]
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - containerPort: 9093
              name: grpc
            - containerPort: 7000
              name: raft
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          readinessProbe:
            tcpSocket:
              port: 9093
            initialDelaySeconds: 5
            periodSeconds: 2
          volumeMounts:
            - name: scripts
              mountPath: /scripts
            - name: raft-data
              mountPath: /data/raft
      volumes:
        - name: scripts
          configMap:
            name: kafka-lite-scripts
            defaultMode: 0755
        - name: raft-data
          emptyDir: {}  # ephemeral — fresh cluster on each test run
