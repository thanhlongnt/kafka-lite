apiVersion: v1
kind: Service
metadata:
  name: broker
spec:
  clusterIP: None  # headless — gives each pod a stable DNS entry
  selector:
    app: broker
  ports:
    - name: grpc
      port: 9092
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: broker
spec:
  serviceName: broker
  replicas: 20
  selector:
    matchLabels:
      app: broker
  template:
    metadata:
      labels:
        app: broker
    spec:
      containers:
        - name: broker
          image: kafka-lite:latest
          imagePullPolicy: Never
          command: ["/bin/sh", "/scripts/start-broker.sh"]
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - containerPort: 9092
              name: grpc
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 8
            periodSeconds: 2
          volumeMounts:
            - name: scripts
              mountPath: /scripts
            - name: broker-data
              mountPath: /data/broker
      volumes:
        - name: scripts
          configMap:
            name: kafka-lite-scripts
            defaultMode: 0755
        - name: broker-data
          emptyDir: {}
